# Codemagic CI — VITRUV mobile (Flutter, apps/mobile)
#
# First workflow: unsigned iOS *simulator* build, same steps as
# .github/workflows/ios-simulator-build.yml. No code signing, no Apple
# credentials, no secrets, no App Store upload. Started manually only
# (no triggering section).
#
# A signed TestFlight workflow needs owner decisions first: Apple Team,
# final bundle ID (current com.vitruv.vitruvMobile is provisional) and an
# App Store Connect API key stored in Codemagic (never in this repo).

workflows:
  ios-simulator:
    name: iOS simulator build (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile
    environment:
      flutter: 3.47.7 # same as the Windows dev machine and GitHub CI
      xcode: latest
      cocoapods: default
      vars:
        # Public HTTPS API (nginx on the live server). Not a secret: the app only
        # holds the public base URL. staging => the app enforces https.
        API_BASE_URL: https://api.vitruv-move.com
        APP_ENV: staging
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Flutter analyze
        script: flutter analyze --no-pub
      - name: Flutter tests
        script: flutter test --no-pub
      - name: Build iOS app for simulator (no signing)
        script: |
          flutter build ios --simulator --debug \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=APP_ENV="$APP_ENV"
    artifacts:
      # Codemagic "Quick Launch" (in-browser simulator) needs the .app bundle
      # itself as artifact, not a zip. Path is relative to working_directory.
      - build/ios/iphonesimulator/Runner.app
